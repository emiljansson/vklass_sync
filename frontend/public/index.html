<!doctype html>
<html lang="sv">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0d5c56" />
        <meta
            name="description"
            content="Lyssna – lär dig uttal av de vanligaste engelska orden med svensk översättning."
        />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="Lyssna" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
        <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <title>Lyssna – engelska ord med uttal</title>
        <script>
            window.addEventListener(
                "error",
                function (e) {
                    if (
                        e.error instanceof DOMException &&
                        e.error.name === "DataCloneError" &&
                        e.message &&
                        e.message.includes("PerformanceServerTiming")
                    ) {
                        e.stopImmediatePropagation();
                        e.preventDefault();
                    }
                },
                true
            );
        </script>
        <script>
            if (window.self !== window.top) {
                var debugMonitorScript = document.createElement("script");
                debugMonitorScript.src =
                    "https://assets.emergent.sh/scripts/debug-monitor.js";
                document.head.appendChild(debugMonitorScript);
                window.tailwind = window.tailwind || {};
                tailwind.config = { corePlugins: { preflight: false } };
                var tailwindScript = document.createElement("script");
                tailwindScript.src = "https://cdn.tailwindcss.com";
                document.head.appendChild(tailwindScript);
            }
        </script>
    </head>
    <body>
        <noscript>Du behöver aktivera JavaScript för att använda Lyssna.</noscript>
        <div id="root"></div>
    </body>
</html>
